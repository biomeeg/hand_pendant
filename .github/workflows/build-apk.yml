name: Build Android APK (hand_pendant_app)

# Cach dung:
#   1. Tao 1 repo GitHub moi (public hoac private deu duoc), push toan bo thu muc
#      hand_pendant_project/ (bao gom ca file workflow nay) len repo do.
#   2. Vao tab "Actions" tren GitHub, workflow "Build Android APK (hand_pendant_app)"
#      se tu chay sau khi push (hoac bam "Run workflow" de chay thu cong).
#   3. Doi build xong (~5-8 phut), vao trang ket qua cua lan chay, keo xuong muc
#      "Artifacts", tai file "hand-pendant-app-debug-apk" ve - ben trong la file .apk,
#      chuyen vao dien thoai Android va cai (nho bat "Cai dat tu nguon khong xac dinh").
#
# Workflow nay chay tren may chu cua GitHub (co day du mang toi pub.dev / may chu Google),
# tu tai Flutter SDK, tai thu vien, tu chen quyen Bluetooth vao AndroidManifest.xml, roi
# build ra file APK ban debug (chua ky release, chi de CAI THU NGHIEM tren dien thoai ca
# nhan, khong dung de phat hanh chinh thuc).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # Khong ghim so phien ban cu the (vd '3.24.5') - luon lay ban stable moi nhat.
          # Ly do: mot so thu vien (vd flutter_blue_plus_android) da cap nhat theo co che
          # nap Flutter Gradle plugin kieu moi (tu Flutter 3.27 tro len). Neu CI dung ban
          # Flutter cu hon, project Android sinh ra se dung dinh dang Gradle cu, gay loi
          # "Could not get unknown property 'flutter' for extension 'android'" va
          # "compileSdkVersion is not specified" khi build.
          channel: 'stable'

      - name: Tai thu vien Dart/Flutter
        run: flutter pub get

      - name: Sinh thu muc android/ (flutter create)
        run: flutter create --platforms=android .

      - name: Chen quyen Bluetooth vao AndroidManifest.xml
        run: python3 scripts/patch_manifest_permissions.py

      - name: Dam bao minSdkVersion >= 21
        run: python3 scripts/check_min_sdk.py

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Tai APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hand-pendant-app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
